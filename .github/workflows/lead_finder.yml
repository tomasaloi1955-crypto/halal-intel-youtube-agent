name: lead_finder

on:
  schedule:
    - cron: "30 5 * * *"    # 05:30 UTC = 10:30 Алматы (вечерний слот убран — DDG стабильно блокировал его)
  workflow_dispatch: {}      # кнопка ручного запуска

permissions:
  contents: write

concurrency:
  group: lead_finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Поиск заказов
        env:
          DATA_DIR: state
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python lead_finder.py

      - name: Сохранить память (найденные заказы, очередь запросов)
        if: always()
        run: |
          git config user.name "lead-finder"
          git config user.email "lead-finder@users.noreply.github.com"
          for f in seen_leads.json lead_rotation.json; do
            [ -f "state/$f" ] && git add "state/$f"
          done
          git diff --cached --quiet && echo "нет изменений состояния" && exit 0
          git commit -m "leads: $(date -u +%F_%H%M) [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push отклонён (гонка с другим коммитом в master), пробую снова: попытка $i"
            git fetch origin master
            git rebase origin/master || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::не удалось сохранить состояние lead_finder после 5 попыток — найденные лиды будут повторены на следующем запуске"
          exit 1
