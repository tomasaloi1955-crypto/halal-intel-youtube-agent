name: _test_elevenlabs (временный)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Мини-запрос к ElevenLabs (без публикации, ответ не сохраняется)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          http_code=$(curl -sS -o /tmp/out.mp3 -w "%{http_code}" \
            "https://api.elevenlabs.io/v1/text-to-speech/$ELEVENLABS_VOICE_ID" \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            -H "content-type: application/json" \
            -d '{"text":"тест","model_id":"eleven_multilingual_v2"}')
          echo "HTTP_STATUS:$http_code"
          if [ "$http_code" != "200" ]; then
            echo "--- тело ответа ---"
            cat /tmp/out.mp3
            exit 1
          fi
          echo "OK: получено $(stat -c%s /tmp/out.mp3) байт аудио"
