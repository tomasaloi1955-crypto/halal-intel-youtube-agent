name: _verdict_smoke

# ВРЕМЕННЫЙ воркфлоу: проверяет, что рубрика «Халяль или харам?» генерирует
# валидный JSON со всеми нужными полями. НИЧЕГО НЕ ПУБЛИКУЕТ — только печатает.
# Удалить после проверки.
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-generativeai requests python-dotenv
      - name: Сгенерировать выпуск рубрики (без публикации)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          python - <<'PY'
          import json
          from ai_processor import process_halal_verdict
          topic = {"practice": "ИИ пишет отзывы о твоём товаре от имени выдуманных покупателей",
                   "keywords": ["online reviews", "fake review", "ecommerce trust"]}
          c = process_halal_verdict(topic)
          assert c, "генерация вернула None"
          need = ["shorts_script", "long_script", "title_shorts", "title_long",
                  "cover_text", "cover_subtitle", "tags", "pexels_keywords", "description"]
          missing = [k for k in need if k not in c]
          assert not missing, f"нет полей: {missing}"
          assert isinstance(c["tags"], list) and isinstance(c["pexels_keywords"], list), "tags/pexels не списки"
          print("ВСЕ ПОЛЯ НА МЕСТЕ:", sorted(c.keys()))
          print("TITLE :", c["title_shorts"])
          print("COVER :", c["cover_text"], "|", c["cover_subtitle"])
          print("PEXELS:", c["pexels_keywords"])
          print("TAGS  :", c["tags"][:6])
          print("\n--- SHORTS SCRIPT ---\n" + c["shorts_script"])
          print("\n--- DESCRIPTION ---\n" + c["description"][:700])
          PY
